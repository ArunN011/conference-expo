<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stackly | 404 - Page Not Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <link
        rel="stylesheet"
        href="error.css"
    >
</head>

<body>

    <main class="error-page">

        <div class="error-background-shape shape-one"></div>
        <div class="error-background-shape shape-two"></div>
        <div class="error-background-shape shape-three"></div>

        <div class="error-container">

            <a
                href="admin-dashboard.html"
                class="error-logo"
            >
                <img
                    src="Assest/whitelogo.webp"
                    alt="Stackly Logo"
                >
            </a>

            <div class="error-content">

                <div class="error-visual">

                    <div class="error-circle">

                        <span class="error-four">4</span>

                        <div class="error-zero">
                            <div class="zero-inner">
                                <i class="bi bi-search"></i>
                            </div>
                        </div>

                        <span class="error-four">4</span>

                    </div>

                    <div class="error-ring ring-one"></div>
                    <div class="error-ring ring-two"></div>

                </div>

                <div class="error-text">

                    <span class="error-label">
                        ERROR 404
                    </span>

                    <h1>
                        Page
                        <span>Not Found</span>
                    </h1>

                    <p>
                        Sorry, the page you're looking for
                        doesn't exist or may have been moved.
                        Let's get you back to Stackly.
                    </p>

                    <div class="error-actions">

                        <a
                            href="index.html"
                            class="home-button"
                        >
                            <i class="bi bi-house-fill"></i>
                            Back to Home
                        </a>

                        <button
                            type="button"
                            class="back-button"
                            id="goBackButton"
                        >
                            <i class="bi bi-arrow-left"></i>
                            Go Back
                        </button>

                    </div>

                </div>

            </div>

            <div class="error-footer">

                <span>
                    &copy; 2026 Stackly. All rights reserved.
                </span>

                <div class="footer-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>

    </main>

    <script src="error.js"></script>

</body>

</html>
