<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stackly | Create Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js">
    </script>

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>

    <main class="register-page">


        <a
            href="index.html"
            class="register-back-home"
        >

            <i class="bi bi-arrow-left"></i>

            <span>
                Back To Home
            </span>

        </a>


        <div class="register-decoration register-decoration-one">

            <i class="bi bi-calendar-event"></i>

        </div>


        <div class="register-decoration register-decoration-two">

            <i class="bi bi-people-fill"></i>

        </div>


        <section class="register-card">


            <div class="register-logo">

                <a href="index.html">

                    <img
                        src="Assest/whitelogo.webp"
                        alt="Stackly Logo"
                    >

                </a>

            </div>


            <div class="register-header">

                <span class="register-small-title">
                    STACKLY CONFERENCE & EXPO
                </span>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Join Stackly Conference & Expo and
                    manage your events, registrations and
                    conference experience with ease.
                </p>

            </div>


            <form
                id="registerForm"
                class="register-form"
                novalidate
            >


                <div class="register-form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <div class="register-input">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <small
                        class="field-error"
                        id="nameError"
                    ></small>

                </div>


                <div class="register-two-column">


                    <div class="register-form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <div class="register-input">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="registerEmail"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <small
                            class="field-error"
                            id="emailError"
                        ></small>

                    </div>


                    <div class="register-form-group">

                        <label for="phoneNumber">
                            Phone Number
                        </label>

                        <div class="register-input">

                            <i class="bi bi-telephone"></i>

                            <input
                                type="tel"
                                id="phoneNumber"
                                placeholder="Enter phone number"
                                autocomplete="tel"
                                inputmode="tel"
                                required
                            >

                        </div>

                        <small
                            class="field-error"
                            id="phoneError"
                        ></small>

                    </div>


                </div>


                <div class="register-two-column">


                    <div class="register-form-group">

                        <label for="organization">
                            Organization
                        </label>

                        <div class="register-input">

                            <i class="bi bi-building"></i>

                            <input
                                type="text"
                                id="organization"
                                placeholder="Company or organization"
                                autocomplete="organization"
                                required
                            >

                        </div>

                        <small
                            class="field-error"
                            id="organizationError"
                        ></small>

                    </div>


                    <div class="register-form-group">

                        <label for="attendeeType">
                            Attendee Type
                        </label>

                        <div class="register-input">

                            <i class="bi bi-person-badge"></i>

                            <select
                                id="attendeeType"
                                required
                            >

                                <option value="">
                                    Select attendee type
                                </option>

                                <option value="Delegate">
                                    Delegate
                                </option>

                                <option value="Speaker">
                                    Speaker
                                </option>

                                <option value="Exhibitor">
                                    Exhibitor
                                </option>

                                <option value="Sponsor">
                                    Sponsor
                                </option>

                                <option value="Visitor">
                                    Visitor
                                </option>

                            </select>

                        </div>

                        <small
                            class="field-error"
                            id="attendeeError"
                        ></small>

                    </div>


                </div>


                <div class="register-two-column">


                    <div class="register-form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="register-input">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="register-password-toggle"
                                data-target="registerPassword"
                                aria-label="Show password"
                            >

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="passwordError"
                        ></small>

                    </div>


                    <div class="register-form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="register-input">

                            <i class="bi bi-lock-fill"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="register-password-toggle"
                                data-target="confirmPassword"
                                aria-label="Show password"
                            >

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="confirmError"
                        ></small>

                    </div>


                </div>


                <label class="register-terms">

                    <input
                        type="checkbox"
                        id="termsCheck"
                    >

                    <span class="custom-check"></span>

                    <span>

                        I agree to the

                        <a href="error.html">
                            Terms & Conditions
                        </a>

                        and

                        <a href="error.html">
                            Privacy Policy
                        </a>.

                    </span>

                </label>


                <small
                    class="field-error"
                    id="termsError"
                ></small>


                <button
                    type="submit"
                    class="register-submit"
                    id="registerSubmit"
                >

                    <span>
                        Create Account
                    </span>

                    <i class="bi bi-arrow-right"></i>

                </button>


                <div
                    class="register-message"
                    id="registerMessage"
                ></div>


            </form>


            <div class="already-account">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>


            <div class="register-security">

                <i class="bi bi-shield-check"></i>

                <span>
                    Your conference registration information
                    is handled securely.
                </span>

            </div>


        </section>

    </main>


    <script src="register.js"></script>

</body>

</html>
